<title>Test de Condición Física v2</title>
<style>
:root{--azul:#0a4d78;--azul2:#0089c9;--cel:#00a8f5;--cel2:#7fd2fb;--plata:#c3ced6;--oro:#00a8f5;--bg:#f3f5f9;--card:#fff;--linea:#dde3ee;--txt:#16233d;--txt2:#5d6a85;
  --ok:#1e8e5a;--okbg:#e3f5ec;--med:#b9821a;--medbg:#fdf3dc;--baj:#c2412f;--bajbg:#fbe6e2;--r:14px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.4;padding-bottom:calc(78px + env(safe-area-inset-bottom));}
main{padding:14px 14px 20px;max-width:820px;margin:0 auto;overflow-x:hidden}
.card h3{margin:8px 0 6px;font-size:13px;font-weight:700;color:var(--azul)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:0 0 4px}
select,input[type=text],input[type=date],textarea{width:100%;max-width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--txt);margin-bottom:8px}
select{max-width:100%;text-overflow:ellipsis;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt2) 50%),linear-gradient(135deg,var(--txt2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
button{font-family:inherit;font-size:15px;border:0;border-radius:10px;padding:11px 14px;background:var(--azul);
  color:#fff;font-weight:600;cursor:pointer;margin-bottom:8px;width:100%}
button:active{opacity:.85}
button.oro{background:var(--cel);color:#fff}
button.gh{background:transparent;color:var(--baj);border:1px solid var(--linea);opacity:.7}
.row{display:flex;gap:8px}.row>*{flex:1}
.alu{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
.alu:last-child{border-bottom:0}
.alu .n{width:22px;font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums;font-weight:700}
.alu .nm{flex:1;font-size:13.5px;line-height:1.25;font-weight:600}
.val{width:60px;text-align:center;font-weight:700;font-size:14px;padding:8px 4px;margin:0!important}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;min-width:0}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{border:1px solid var(--linea);padding:5px 4px;text-align:center;white-space:nowrap;font-size:11.5px}
th{background:var(--azul);color:#fff;font-size:10.5px;font-weight:700}
th.gr{background:var(--oro);color:#3a2a00}
td.nm{text-align:left;max-width:140px;font-size:11.5px;line-height:1.2;white-space:normal}
tbody tr:nth-child(even) td{background:#fafbfe}
.evrow{padding:11px 0;border-bottom:1px solid var(--linea)}
.evrow:last-child{border-bottom:0}
.evtop{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}
.evtop .n{font-size:11px;color:var(--txt2);font-weight:700;min-width:20px;font-variant-numeric:tabular-nums}
.evtop .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.evbot{display:flex;gap:9px;align-items:center}
.testgrp{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.testgrp button{width:100%;padding:11px 8px;margin:0;display:flex;align-items:center;justify-content:center;gap:7px;background:#fafbfc;color:var(--txt2);border:1px solid var(--linea);border-radius:10px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.2}
.testgrp button.sel{background:linear-gradient(135deg,#0089c9,#0a4d78);color:#fff;border-color:#0a4d78}
.grupo{display:inline-flex;flex:0 0 auto;border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.grupo button{width:46px;padding:10px 0;margin:0;border:0;border-right:1px solid var(--linea);background:#fafbfc;color:var(--txt2);font-weight:700;font-size:12.5px;border-radius:0}
.grupo button:last-child{border-right:0}
.grupo button.sel{background:var(--azul);color:#fff}
.evbot input{flex:1;margin:0!important;padding:10px;font-size:15px;text-align:center;font-weight:600}
.asi1{flex:0 0 62px;width:62px;padding:11px 0;margin:0!important;border:1px solid var(--linea);border-radius:10px;background:#fafbfc;color:var(--txt2);font-weight:700;font-size:14px}
.lg1{flex:1;padding:11px 4px;margin:0!important;border:1px solid var(--linea);border-radius:10px;
  background:#fafbfc;color:var(--txt2);font-weight:700;font-size:13px}
.lg1.l{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.lg1.nl{background:var(--bajbg);color:var(--baj);border-color:var(--baj)}
.segbox{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.segbox input{width:90px!important;margin:0!important;text-align:center;font-weight:700}
.segbox span{font-size:12.5px;color:var(--txt2);font-weight:600}
.asi1.p{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.asi1.a{background:var(--bajbg);color:var(--baj);border-color:var(--baj)}
.asi1.j{background:var(--medbg);color:var(--med);border-color:var(--med)}
.asistencia{display:flex;gap:3px;justify-content:center}
.asistencia button{width:32px;padding:6px 0;font-size:10px;margin:0;border:1px solid var(--linea);background:#fafbfc;color:var(--txt2);font-weight:700}
.asistencia button.on-P,.asistencia button.on-A,.asistencia button.on-J{background:var(--azul);color:#fff;border-color:var(--azul)}
#printarea{display:none}

/* ===== Encabezado ===== */
header{background:linear-gradient(135deg,#00a8f5 0%,#0089c9 48%,#0a4d78 100%);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;position:sticky;top:0;z-index:50;
  border-bottom:3px solid var(--plata)}
.hrow{display:flex;align-items:center;gap:9px}
.logo{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
.logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
.pill{width:auto!important;flex:0 0 auto;margin:0!important;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34);color:#fff;
  padding:8px 13px!important;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.01em}
.pill .chev{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.autosave{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#eaf8ff}
.autosave i{width:7px;height:7px;border-radius:50%;background:#5fd39a;flex:0 0 7px}
.autosave.off i{background:#e5a13c}
.hsub{margin-top:8px;font-size:11px;color:#d9f0fd;font-weight:500}
.pillsel{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* ===== Tarjetas ===== */
.card{background:var(--card);border:1px solid #e8ecf4;border-radius:24px;padding:19px;
  margin-bottom:12px;max-width:100%;overflow:hidden}
.card h2{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}

/* Cabecera del test */
.chip{display:inline-flex;align-items:center;gap:7px;background:#e6f6ee;color:#12855a;
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.chip i{width:8px;height:8px;border-radius:50%;background:#19a86f;flex:0 0 8px}
.titulo{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0 0 7px}
.meta{font-size:13.5px;color:var(--txt2);margin-bottom:12px}
.codigo{display:inline-block;border:1px solid #bfe4fa;color:#0a4d78;background:#eaf7fe;
  padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;letter-spacing:.04em;margin-bottom:12px}
.fecharow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#f5f7fb;border-radius:12px;padding:6px 8px 6px 14px}
.fecharow label{font-size:13.5px;font-weight:700;color:var(--txt);margin:0}
.fecharow input{width:auto!important;flex:1;margin:0!important;border:0;background:transparent;
  text-align:center;font-weight:700;font-size:15px;padding:8px 4px}

/* ===== Metricas ===== */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.mcard{border-radius:18px;padding:14px;display:flex;align-items:center;gap:11px;border:1px solid transparent}
.mcard .bola{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center}
.mcard .bola svg{width:20px;height:20px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mcard .cnt{min-width:0}
.mcard .lab{font-size:13px;font-weight:700;margin-bottom:1px;line-height:1.2}
.mcard .val{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.m-az{background:#e3f4fe;border-color:#c8ebfc}.m-az .lab{color:#2b7fae}.m-az .val,.m-az .bola svg{color:#0a72a8;stroke:#0a72a8}
.m-vd{background:#e7f6ee;border-color:#d2ebdd}.m-vd .lab{color:#3d8a67}.m-vd .val,.m-vd .bola svg{color:#12855a;stroke:#12855a}
.m-mo{background:#f3ecfb;border-color:#e6d9f4}.m-mo .lab{color:#6d5aa4}.m-mo .val,.m-mo .bola svg{color:#6b3fc4;stroke:#6b3fc4}
.m-na{background:#fdeee4;border-color:#f7ddcb}.m-na .lab{color:#a9673c}.m-na .val,.m-na .bola svg{color:#d4622a;stroke:#d4622a}

/* aviso pedagogico */
.foco{display:flex;gap:13px;align-items:flex-start;background:linear-gradient(135deg,#eaf8f0 0%,#f4fbf7 100%);
  border:1px solid #d2ebdd;border-radius:22px;padding:17px;margin-bottom:12px}
.foco .bola{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:#19a86f;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(25,168,111,.35)}
.foco .bola svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2}
.foco.pend{background:linear-gradient(135deg,#fdf3e4 0%,#fefaf3 100%);border-color:#f3e0c0}
.foco.pend .bola{background:#d99a1f;box-shadow:0 3px 10px rgba(217,154,31,.35)}
.foco .k{font-size:13px;font-weight:800;color:#12855a;margin-bottom:2px}
.foco.pend .k{color:#a9762a}
.foco .t{font-size:16.5px;font-weight:800;letter-spacing:-.015em;line-height:1.25;color:var(--txt)}
.foco .s{font-size:13px;font-weight:600;color:#3d8a67;margin-top:4px;line-height:1.35}
.foco.pend .s{color:#a9762a}

/* ===== Botones de accion ===== */
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:linear-gradient(135deg,#00a8f5 0%,#0a4d78 100%);color:#fff;
  border-radius:18px;padding:14px 16px!important;font-size:15.5px;font-weight:700;margin-bottom:9px}
.cta .ico{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.cta .arrow{margin-left:auto;font-size:17px;opacity:.85}
.fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:1px solid #e8ecf4;color:var(--txt);border-radius:18px;padding:12px 14px!important;
  font-size:14.5px;font-weight:700;margin-bottom:9px}
.fila .ico{width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:#eaf7fe;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.fila .arrow{margin-left:auto;color:var(--txt2);font-size:16px}

/* ===== Tarjeta con franja superior ===== */
.card.top{position:relative;padding-top:24px}
.card.top::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;
  background:linear-gradient(180deg,#00a8f5 0%,#0089c9 55%,var(--plata) 55%,var(--plata) 100%);
  border-radius:24px 24px 0 0}

/* ===== Metricas en tres ===== */
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 4px}
.m3 .mc{border-radius:14px;padding:12px 8px;text-align:center;border:1px solid transparent}
.m3 .mc .v{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--txt)}
.m3 .mc .l{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#5d6a85;margin-top:5px;line-height:1.25}

.m3 .vd{background:#e9f6ee;border-color:#cfe9da}
.m3 .mo{background:#f6edfb;border-color:#e6d7f2}

/* ===== Icono de test ===== */
.tico{width:26px;height:26px;display:block}
.testgrp .ti{width:24px;height:24px;flex:0 0 24px}
.tround{width:62px;height:62px;flex:0 0 62px;border-radius:50%;background:#e3f4fe;
  display:flex;align-items:center;justify-content:center}
.tround .tico{width:38px;height:38px}
.tbig{width:96px;height:96px;flex:0 0 96px;border-radius:50%;background:#e3f4fe;
  display:flex;align-items:center;justify-content:center;margin-left:10px}
.tbig .tico{width:60px;height:60px}
.paso .num .tico{width:22px;height:22px}
.thero{display:flex;align-items:flex-start;gap:6px}
.thero .txt{flex:1;min-width:0}
.thead{display:flex;gap:14px;align-items:flex-start}
.thead .txt{flex:1;min-width:0}

/* ===== Tabla comparativa ===== */
.tabc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #dde6f2;border-radius:14px}
.tabc table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.tabc th,.tabc td{padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid #eaeff7}
.tabc thead th{background:#e3f4fe;color:#0a4d78;font-size:10.5px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0}
.tabc .est{text-align:left;position:sticky;left:0;background:#fff;z-index:2;min-width:150px;
  border-right:1px solid #dde6f2;white-space:normal;font-weight:700;color:var(--azul2);font-size:12.5px}
.tabc thead .est{background:#e3f4fe;z-index:3}
.tabc tbody tr:nth-child(even) td{background:#fafbfe}
.tabc tbody tr:nth-child(even) .est{background:#fafbfe}
.tabc .idx{color:#93a1ba;font-size:10.5px;font-weight:800;margin-right:5px}
.dchip{display:inline-block;background:#c8ebfc;color:#0a4d78;border-radius:7px;
  padding:1px 7px;font-size:10px;font-weight:800;margin-bottom:3px}
.trend{font-weight:800;font-size:11.5px}
.trend.up{color:#12855a}.trend.down{color:#c2412f}.trend.eq{color:#93a1ba}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--txt2)}
.leyenda b{font-weight:800}

/* ===== Inicio ===== */
.hero{background:linear-gradient(150deg,#00a8f5 0%,#0089c9 52%,#0a4d78 100%);color:#fff;
  border:0;border-radius:22px;padding:22px 20px 20px}
.hero .chip{background:rgba(255,255,255,.18);color:#eaf8ff}
.hero .chip i{background:#fff}
.hero .titulo{color:#fff;font-size:29px}
.hero p{margin:10px 0 0;font-size:14.5px;line-height:1.5;color:#dff2fe}
.hero .oro{color:#fff;font-weight:800}
.paso{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eef1f7}
.paso:last-child{border-bottom:0}
.paso .num{width:26px;height:26px;flex:0 0 26px;overflow:hidden;border-radius:50%;background:#0089c9;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
.paso .tx{font-size:13.5px;line-height:1.4;color:var(--txt)}
.paso .tx b{display:block;font-size:14px;margin-bottom:1px}

/* ===== Selector de estudiante ===== */
.selbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#f5f8fd;
  border:1px solid #dbe6f5;color:var(--txt);border-radius:14px;padding:12px 14px!important;
  font-size:15px;font-weight:700;margin:0!important}
.selbtn .np{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#0089c9;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.selbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn .cv{color:var(--txt2);font-size:15px}
.navest{display:flex;gap:8px;margin-top:9px}
.navest button{flex:1;margin:0!important;background:#fff;border:1px solid #dbe6f5;color:var(--azul2);
  font-size:13px;font-weight:700;padding:9px 6px!important;border-radius:11px}
.navest button:disabled{opacity:.4}
.picker{margin-top:10px;border:1px solid #dbe6f5;border-radius:14px;overflow:hidden}
.picker input{margin:0!important;border:0;border-bottom:1px solid #eef2f8;border-radius:0;
  font-size:15px;padding:12px 14px}
.pklist{max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;
  border-bottom:1px solid #f1f4f9;color:var(--txt);padding:11px 14px!important;margin:0!important;
  font-size:14px;font-weight:600;border-radius:0}
.pkrow:last-child{border-bottom:0}
.pkrow .np{width:26px;flex:0 0 26px;color:#93a1ba;font-size:11px;font-weight:800}
.pkrow.on{background:#e3f4fe;color:var(--azul2);font-weight:800}
.pkrow .tick{margin-left:auto;color:var(--azul2);font-weight:800}
.pkvacio{padding:16px;text-align:center;color:var(--txt2);font-size:13px}

/* ===== Navegacion inferior ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid #e6eaf2;display:flex;
  padding:7px 2px calc(7px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;padding:3px 1px;font-size:10.5px;font-weight:600;color:#8b96ab;
  text-decoration:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--azul2)}
nav a.on svg{stroke-width:2.1}

@media print{
  body>header,body>nav,body>main,body>.toast{display:none!important}
  #printarea{display:block!important;padding:0;font-size:11pt;color:#000}
  #printarea h1{font-size:15pt;margin:0 0 2mm}
  #printarea .meta{font-size:9pt;color:#444;margin-bottom:4mm}
  #printarea table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printarea th,#printarea td{border:1px solid #999;padding:2mm;text-align:center}
  #printarea th{background:#e8ecf3}
  #printarea td.nm{text-align:left}
  #printarea h3{font-size:11pt;margin:5mm 0 1.5mm}
  @page{margin:12mm}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--txt);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
.hint{font-size:12px;color:var(--txt2);line-height:1.35;margin-top:8px}
.lvl{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.lvl.a{background:var(--okbg);color:var(--ok)}
.lvl.m{background:var(--medbg);color:var(--med)}
.lvl.b{background:var(--bajbg);color:var(--baj)}
.lvl.x{background:#eef1f6;color:var(--txt2)}
.delta{font-size:11px;font-weight:700;padding:0 4px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--baj)}
.delta.eq{color:var(--txt2)}
@media print{body{padding:0;background:#fff}header,nav{display:none!important}}
</style>

  <a data-v="inicio"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5h4v5"/></svg>Inicio</a>
  <a data-v="evaluaciones"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>Evaluaciones</a>

</nav>

<div id="printarea"></div>
<div class="toast" id="toast"></div>

<script>
const VER='37';

/* Autoactualizacion: si en el servidor hay una version mas nueva, recarga solo */
setTimeout(()=>{
  if(typeof fetch!=='function')return;
  fetch(location.pathname+'?_ac='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():null)
    .then(t=>{
      if(!t)return;
      const m=t.match(/const VER='([^']+)'/);
      if(m&&m[1]!==VER&&!location.search.includes('v='+m[1])){
        location.replace(location.pathname+'?v='+m[1]);
      }
    }).catch(()=>{});
},1200);

/* Limpia Service Workers y caches antiguos que servian la version vieja */
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations()
  .then(rs=>rs.forEach(r=>{const sc=(r.scope||'');if(sc.replace(/https?:\/\/[^/]+/,'')==='/')r.unregister()}))
  .catch(()=>{});
  navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{})}

const KEY='cjp2_tcf_v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const hoy=()=>new Date().toISOString().slice(0,10);
const num=v=>{if(v===undefined||v===null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const fmt=(x,d=2)=>x===null?'—':x.toFixed(d).replace('.',',');

const D5=[["ARANZAVE MONTECINOS AMANDA"],["BARRIOS PARRA JOSÉ EMILIANO"],["CHÁVEZ AGUILERA MÍA BELLA"],
["CORNEJO KUSHNER EMMA ANTONIA"],["CORONADO CARMONA EMILY PASCAL"],["FUENTEALBA LEÓN ALEXA ANAÍS"],
["GAMBOA ESCOBAR AYLEEN ELIZABETH"],["JARAMILLO CHICO MAITE AINNARA"],["JARAMILLO FLORES ELIZABETH"],
["JOFRÉ CIFUENTES ANGELO ANTONIO"],["MANCILLA LEIVA DAVID ALONSO"],["OBANDO MOLINA MONSERRAT CRISTEL"],
["OSORIO MUÑOZ FRANCISCA PAZ"],["PAILAPICHÚN HERNÁNDEZ CATALINA"],["PEÑA ARANEDA EMMA IGNACIA"],
["PÉREZ SILVA FLORENCIA KATALINA"],["PÉREZ VERA DALMA YHIZEL"],["SÁEZ VILLEGAS JACOB ALEXSANDER"],
["SALDÍA ORTIZ JORGE MAXIMILIANO"],["SANTIBÁÑEZ SOMOZA MAITE ANYELINA"],["SOTO CEA MAYTE ISABEL"],
["VÁSQUEZ RIFFO SARAI ELIZABETH"],["SALGADO MARTINA"]];

function seed(){
  const db={
    tests:[
      {id:'vel',n:'Velocidad',ico:'⚡',tipo:'num',u:'s',mejor:'menor',mts:20,c1:4.10,c2:4.70,evals:[]},
      {id:'sal',n:'Salto',ico:'🦘',tipo:'num',u:'cm',mejor:'mayor',c1:19,c2:14,evals:[]},
      {id:'abd',n:'Abdominales',ico:'💪',tipo:'num',u:'rep',mejor:'mayor',c1:19,c2:15,evals:[]},
      {id:'pla',n:'Plancha',ico:'🧘',tipo:'logro',op:['L','NL'],seg:30,evals:[]},
      {id:'flex',n:'Flexiones de brazo',ico:'📏',tipo:'num',u:'rep',mejor:'mayor',c1:15,c2:10,evals:[]},
      {id:'tro',n:'Trote',ico:'🏃',tipo:'num',u:'rep',mejor:'mayor',c1:100,c2:70,evals:[]}
    ],
    cursos:[],adaptaciones:{},activo:null,alumno:null
  };
  const c5={id:uid(),n:'5º Básico',alumnos:[]};
  D5.forEach(f=>{c5.alumnos.push({id:uid(),n:f[0]})});
  db.cursos.push(c5);
  ['6º Básico','7º Básico','8º Básico'].forEach(n=>{db.cursos.push({id:uid(),n:n,alumnos:[]})});
  db.activo=c5.id;
  db.alumno=c5.alumnos[0].id;
  return db;
}

let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
if(!DB||!DB.cursos){DB=seed()}
const _ve=DB.tests&&DB.tests.find(t=>t.id==='vel');
if(_ve){if(typeof _ve.mts!=='number'){const m=/(\d+)\s*m/.exec(_ve.n);_ve.mts=m?parseInt(m[1],10):20}
  _ve.n='Velocidad';_ve.u='s'}
const _pl=DB.tests&&DB.tests.find(t=>t.id==='pla');
if(_pl){_pl.op=['L','NL'];if(typeof _pl.seg!=='number')_pl.seg=30;
  (_pl.evals||[]).forEach(e=>{if(e.val==='P')e.val='NL'})}
const save=(local)=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('No se pudo guardar')}if(!local)subirPronto()};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)};
const curso=()=>DB.cursos.find(c=>c.id===DB.activo)||DB.cursos[0];
const fcorta=f=>{if(!f)return '—';const p=f.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0].slice(2):f};

function nivel(test,v){const x=num(v);if(x===null)return 'x';if(test.tipo==='logro')return(v==='L')?'a':(v==='P'?'m':'b');if(test.mejor==='menor')return x<=test.c1?'a':(x<=test.c2?'m':'b');return x>=test.c1?'a':(x>=test.c2?'m':'b')}

let VIEW='inicio';let LASTVIEW=null;let TESTSEL=(DB.tests.find(t=>t.id===DB.testsel)||DB.tests[0]).id;
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();VIEW=a.dataset.v;render()}));

function render(){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===VIEW));
  const v={inicio:vInicio,cursos:vCursos,evaluaciones:vEvaluaciones,consolidado:vConsolidado,alumno:vAlumno,adaptaciones:vAdaptaciones,datos:vDatos};
  const y=window.scrollY;
  let html='';
  try{html=v[VIEW]?v[VIEW]():''}
  catch(err){html=`<div class="card"><h2>No se pudo abrir esta sección</h2><div class="hint">${(err&&err.message)||err}</div><button type="button" class="cta" id="goIni" style="margin-top:12px"><span class="ico">🏠</span>Volver al inicio<span class="arrow">›</span></button></div>`}
  document.getElementById('app').innerHTML=html;
  if(VIEW!==LASTVIEW){window.scrollTo(0,0);LASTVIEW=VIEW}else{window.scrollTo(0,y)}
  bind();
}

function vCursos(){
  const c=curso();
  let h=`<div class="card"><h2>Cursos</h2><select id="selCurso">${DB.cursos.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.n} · ${x.alumnos.length} estudiantes</option>`).join('')}</select></div>`;
  h+=`<div class="card"><h2>Estudiantes</h2>`;
  if(!c.alumnos.length)h+=`<div style="text-align:center;color:var(--txt2);padding:20px">Sin estudiantes</div>`;
  c.alumnos.forEach((a,i)=>{h+=`<div class="alu"><div class="n">${i+1}</div><div class="nm">${a.n}</div><button class="gh" style="width:60px;font-size:12px;margin:0" id="verA${a.id}">Ver</button><button class="gh" style="width:50px;font-size:12px;margin:0" id="delA${a.id}">✕</button></div>`});
  h+=`<div class="row"><input type="text" id="nuevoAlu" placeholder="Nombre completo" style="margin-bottom:0"><button class="oro" id="addAlu" style="flex:0 0 88px;margin-bottom:0">Agregar</button></div></div>`;
  return h;
}

function metricas(){
  const t=testAct(),f=fechaAct(),c=curso();
  const ev=(t.evals||[]).filter(e=>e.fecha===f);
  let pres=0,aus=0,just=0,con=0,suma=0,logr=0;
  c.alumnos.forEach(a=>{
    const e=ev.find(x=>x.aid===a.id);
    if(!e)return;
    if(e.asist==='P')pres++;else if(e.asist==='A')aus++;else if(e.asist==='J')just++;
    if(e.val){con++;
      if(t.tipo==='logro'){if(e.val==='L')logr++}
      else{const n=num((e.val+'').replace(',','.'));if(n!==null&&!isNaN(n))suma+=n}
    }
  });
  return {pres,aus,just,con,total:c.alumnos.length,
          prom:(t.tipo!=='logro'&&con)?(suma/con):null,
          logro:(t.tipo==='logro'&&con)?Math.round(logr/con*100):null};
}

function vInicio(){
  const c=curso();
  let regs=0, fechas={};
  DB.tests.forEach(t=>(t.evals||[]).forEach(e=>{regs++;fechas[e.fecha]=1}));
  const jornadas=Object.keys(fechas).length;
  const alumnos=DB.cursos.reduce((n,x)=>n+x.alumnos.length,0);

  let h=`<div class="card hero">
    <div class="chip"><i></i>Año escolar 2026</div>
    <h1 class="titulo">Test de Condición Física</h1>
    <p>Registra los seis tests físicos de <span class="oro">5º a 8º básico</span>, con asistencia, resultados por fecha y comparación entre evaluaciones.</p>
  </div>`;

  h+=`<div class="mgrid">
    ${cuadro('m-az','est','Estudiantes',alumnos)}
    ${cuadro('m-vd','test','Tests',DB.tests.length)}
    ${cuadro('m-mo','reg','Registros',regs)}
    ${cuadro('m-na','fecha','Jornadas',jornadas)}
  </div>`;

  h+=`<button type="button" class="cta" id="goEval"><span class="ico">📝</span>Registrar evaluación<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="goCon"><span class="ico">📊</span>Consolidado comparativo<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="goAlu"><span class="ico">🏃</span>Ficha del estudiante<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="goCur"><span class="ico">👥</span>Cursos y estudiantes<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="goAda"><span class="ico">⚙️</span>Adaptaciones<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="goDat"><span class="ico">☁️</span>Sincronización<span class="arrow">›</span></button>`;

  h+=`<div class="card"><h2>Cómo funciona</h2>
    <div class="paso"><div class="num">1</div><div class="tx"><b>Eliges el test y la fecha</b>Velocidad, salto, abdominales, plancha, flexiones o trote.</div></div>
    <div class="paso"><div class="num">2</div><div class="tx"><b>Marcas asistencia y resultado</b>Un toque cambia entre presente, ausente y justificado. El resultado se escribe al lado.</div></div>
    <div class="paso"><div class="num">3</div><div class="tx"><b>Revisas el avance</b>La ficha del estudiante muestra todas sus fechas y cuánto mejoró entre una y otra.</div></div>
    <div class="paso"><div class="num">4</div><div class="tx"><b>Imprimes el informe</b>Del curso completo o de un estudiante, listo para guardar como PDF.</div></div>
  </div>`;

  h+=`<div class="card"><h2>Los seis tests</h2>${DB.tests.map(t=>`<div class="paso"><div class="num" style="background:#e3f4fe;width:34px;height:34px;flex:0 0 34px">${icoSVG(t.id,'tico')}</div><div class="tx"><b>${nomTest(t)}</b>${t.tipo==='logro'?'Logrado o no logrado · '+(t.seg||30)+' segundos':'Resultado en '+nomUni(t.u||'número')}</div></div>`).join('')}</div>`;

  h+=`<div class="hint" style="text-align:center;padding:4px 0 8px">Colegio Juan Pablo Segundo · Los Lagos</div>`;
  return h;
}

function cuadro(cls,ico,lab,val){
  return `<div class="mcard ${cls}">${micSVG(ico)}<div class="cnt"><div class="lab">${lab}</div><div class="val">${val}</div></div></div>`;
}

function cuadros(m,t){
  const tercero = t.tipo==='logro'
    ? cuadro('m-mo','logro','Logro', m.logro===null?'—':m.logro+'%')
    : cuadro('m-mo','prom','Promedio', m.prom===null?'—':fmt(m.prom,1).replace('.',','));
  return cuadro('m-az','reg','Registrados', m.con+'/'+m.total)
       + cuadro('m-vd','ok','Presentes', m.pres)
       + tercero
       + cuadro('m-na','aus','Ausentes', m.aus);
}

function focoHTML(){
  const m=metricas(), t=testAct();
  const falta=m.total-m.con-m.aus-m.just;
  if(falta>0)
    return `<div class="foco pend"><span class="bola"><svg viewBox="0 0 24 24">${MIC.alerta}</svg></span>
      <div><div class="k">Foco pedagógico</div>
      <div class="t">${falta} ${falta===1?'estudiante sin registrar':'estudiantes sin registrar'} en esta fecha.</div>
      <div class="s">Marca su asistencia o su resultado para completar la evaluación.</div></div></div>`;
  if(!m.con)
    return `<div class="foco pend"><span class="bola"><svg viewBox="0 0 24 24">${MIC.alerta}</svg></span>
      <div><div class="k">Foco pedagógico</div>
      <div class="t">Aún no hay registros en esta fecha.</div>
      <div class="s">Empieza marcando la asistencia del curso.</div></div></div>`;
  const det = t.tipo==='logro'
    ? `${m.logro}% de quienes rindieron alcanzó el logro.`
    : `Promedio del curso: ${fmt(m.prom,1).replace('.',',')} ${nomUni(t.u)}.`;
  return `<div class="foco"><span class="bola"><svg viewBox="0 0 24 24">${MIC.ok}</svg></span>
    <div><div class="k">Foco pedagógico</div>
    <div class="t">Curso completo en esta fecha.</div>
    <div class="s">${det}${m.aus+m.just?' '+(m.aus+m.just)+' sin evaluar por inasistencia.':''}</div></div></div>`;
}

function vEvaluaciones(){
  const c=curso(),t=testAct(),m=metricas();
  if(!c.alumnos.length)return `<div class="card"><h2>Sin estudiantes</h2><div class="hint">Agrega estudiantes en la pestaña Cursos para empezar a registrar.</div></div>`;

  let h=`<div class="card top">
    <div class="thero"><div class="txt">
      <div class="chip"><i></i>En evaluación</div>
      <h1 class="titulo">${nomTest(t)}</h1>
      <div class="meta">${c.alumnos.length} estudiantes${t.u?' · resultado en '+nomUni(t.u):''}${t.tipo==='logro'?' · logrado o no logrado':''}</div>
      <div class="codigo">EF ${t.id.toUpperCase()} · ${c.n} · 2026</div>
    </div><div class="tbig">${icoSVG(t.id)}</div></div>
    <div id="extra">${extraHTML()}</div>
    <div class="fecharow"><label for="evalFecha">Fecha</label><input type="date" id="evalFecha" value="${hoy()}"></div>
  </div>`;

  h+=`<div class="card"><h2>Elegir test</h2><div class="testgrp">${DB.tests.map(x=>`<button type="button" class="tbtn ${x.id===TESTSEL?'sel':''}" data-t="${x.id}">${icoSVG(x.id,'tico ti')}<span>${nomTest(x)}</span></button>`).join('')}</div></div>`;

  h+=`<div id="foco">${focoHTML()}</div>`;
  h+=`<div class="mgrid" id="mgrid">${cuadros(m,t)}</div>`;

  h+=`<div class="card"><h2>Estudiantes</h2><div id="filas">${filasHTML()}</div>`;
  h+=`<div class="hint" id="pista">${pistaHTML()}</div></div>`;

  h+=`<button type="button" class="cta" id="pdfCurso"><span class="ico">📄</span>Informe del curso<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="docCurso"><span class="ico">📝</span>Informe del curso en Word<span class="arrow">›</span></button>`;
  return h;
}

function extraHTML(){
  const t=testAct();
  if(t.tipo==='logro')
    return `<label class="f">Tiempo que debe mantener</label><div class="segbox"><input type="text" id="segObj" inputmode="numeric" value="${t.seg||30}"><span>segundos</span></div>`;
  if(t.id==='vel')
    return `<label class="f">Distancia a recorrer</label><div class="segbox"><input type="text" id="mtsObj" inputmode="numeric" value="${t.mts||20}"><span>metros · se cronometra en segundos</span></div>`;
  return '';
}

function pistaHTML(){
  const t=testAct();
  const base='Asistencia: — → P (presente) → A (ausente) → J (justificado).';
  if(t.tipo==='logro')return base+' Resultado: — → L (logrado) → NL (no logrado). Todo se guarda solo.';
  return base+' Todo se guarda solo.';
}

function filasHTML(){
  const c=curso(),t=testAct(),f=fechaAct();
  let h='';
  c.alumnos.forEach((a,i)=>{
    const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);
    const as=e&&e.asist?e.asist:'', vl=e&&e.val?e.val:'';
    h+=`<div class="evrow"><div class="evtop"><div class="n">${i+1}</div><div class="nm">${a.n}</div></div>`;
    h+=`<div class="evbot"><button type="button" class="asi1 ${as.toLowerCase()}" id="asi${a.id}" data-a="${a.id}" data-sel="${as}">${as||'—'}</button>`;
    if(t.tipo==='logro'){
      h+=`<button type="button" class="lg1 ${vl.toLowerCase()}" id="val${a.id}" data-a="${a.id}" data-sel="${vl}">${vl||'—'}</button>`;
    }else{
      h+=`<input type="text" id="val${a.id}" placeholder="valor" inputmode="decimal" value="${vl}">`;
    }
    h+=`</div></div>`;
  });
  return h;
}

function pintarMetricas(){
  const fo=document.getElementById('foco');if(fo)fo.innerHTML=focoHTML();
  const g=document.getElementById('mgrid');if(!g)return;
  g.innerHTML=cuadros(metricas(),testAct());
}

function pintarCabTest(){
  const t=testAct(),c=curso();
  const ic=document.querySelector('.tbig');
  if(ic)ic.innerHTML=icoSVG(t.id);
  const ti=document.querySelector('.thero .titulo');
  if(ti)ti.textContent=nomTest(t);
  const me=document.querySelector('.thero .meta');
  if(me)me.textContent=`${c.alumnos.length} estudiantes`+(t.u?' · resultado en '+nomUni(t.u):'')+(t.tipo==='logro'?' · logrado o no logrado':'');
  const co=document.querySelector('.thero .codigo');
  if(co)co.textContent=`EF ${t.id.toUpperCase()} · ${c.n} · 2026`;
}

function refrescar(){
  pintarCabTest();
  const fx=document.getElementById('filas');if(!fx)return;
  fx.innerHTML=filasHTML();
  pintarMetricas();
  const ex=document.getElementById('extra');if(ex)ex.innerHTML=extraHTML();
  const pi=document.getElementById('pista');if(pi)pi.innerHTML=pistaHTML();
  bindFilas();
}

const sinTilde=x=>(x||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function filasPicker(q){
  const c=curso();
  const t=sinTilde((q||'').trim());
  const lista=c.alumnos.map((x,i)=>({x,i})).filter(o=>!t||sinTilde(o.x.n).includes(t));
  if(!lista.length)return `<div class="pkvacio">Ningún estudiante coincide con la búsqueda</div>`;
  return lista.map(o=>`<button type="button" class="pkrow ${o.x.id===DB.alumno?'on':''}" data-e="${o.x.id}">
    <span class="np">${String(o.i+1).padStart(2,'0')}</span><span>${o.x.n}</span>
    ${o.x.id===DB.alumno?'<span class="tick">✓</span>':''}</button>`).join('');
}

function vAlumno(){
  const c=curso();
  if(!c.alumnos.length)return `<div class="card"><h2>${c.n} no tiene estudiantes</h2><div class="hint">Agrégalos en la pestaña Cursos y vuelve aquí.</div><button type="button" class="cta" id="goCur" style="margin-top:12px"><span class="ico">👥</span>Ir a Cursos<span class="arrow">›</span></button></div>`;
  if(!c.alumnos.find(a=>a.id===DB.alumno))DB.alumno=c.alumnos[0].id;
  const a=c.alumnos.find(x=>x.id===DB.alumno);
  const pos=c.alumnos.findIndex(x=>x.id===a.id);
  let h=`<div class="card"><h2>Estudiante</h2>
    <button type="button" class="selbtn" id="abrirSel">
      <span class="np">${String(pos+1).padStart(2,'0')}</span>
      <span class="nm">${a.n}</span><span class="cv">▾</span></button>
    <div class="navest">
      <button type="button" id="estPrev" ${pos<=0?'disabled':''}>‹ Anterior</button>
      <button type="button" id="estNext" ${pos>=c.alumnos.length-1?'disabled':''}>Siguiente ›</button>
    </div>
    <div class="picker" id="picker" style="display:none">
      <input type="text" id="buscaEst" placeholder="Buscar por nombre o apellido" autocomplete="off">
      <div class="pklist" id="pklist">${filasPicker('')}</div>
    </div></div>`;
  // ---- resumen del estudiante ----
  const resumen=DB.tests.map(t=>{
    const ev=(t.evals||[]).filter(e=>e.aid===a.id).sort((x,y)=>new Date(x.fecha)-new Date(y.fecha));
    const con=ev.filter(e=>e.val);
    return {t, ev, con,
      prim: con.length?con[0]:null,
      ult: con.length?con[con.length-1]:null,

function fechasDe(t){const f={};(t.evals||[]).forEach(e=>f[e.fecha]=1);
  return Object.keys(f).sort((a,b)=>new Date(a)-new Date(b))}

function valNum(t,v){
  if(!v)return null;
  if(t.tipo==='logro')return v==='L'?1:0;
  const n=parseFloat((v+'').replace(',','.'));
  return isNaN(n)?null:n;
}

function mejora(t,ant,act){
  const a=valNum(t,ant), b=valNum(t,act);
  if(a===null||b===null)return null;
  const d=Math.round((b-a)*10)/10;
  if(d===0)return {c:'eq',t:'='};
  const bueno = t.mejor==='menor' ? d<0 : d>0;
  const abs=Math.abs(d);
  const txt=(abs%1===0?abs.toFixed(0):abs.toFixed(1).replace('.',','));
  const signo = (t.tipo==='logro') ? (d>0?'↑':'↓') : (d>0?'+':'−')+txt;
  return {c:bueno?'up':'down', t:signo};
}

function vConsolidado(){
  const c=curso(), t=testAct(), fs=fechasDe(t);
  if(!c.alumnos.length)return `<div class="card"><h2>${c.n} no tiene estudiantes</h2><div class="hint">Agrégalos en la pestaña Cursos para poder comparar evaluaciones.</div><button type="button" class="cta" id="goCur" style="margin-top:12px"><span class="ico">👥</span>Ir a Cursos<span class="arrow">›</span></button></div>`;
  let h=`<div class="card top">
    <div class="thead"><div class="tround">${icoSVG(t.id)}</div>
      <div class="txt"><h1 class="titulo" style="font-size:22px">${nomTest(t)}</h1>
      <div class="meta">${c.n} · ${fs.length} ${fs.length===1?'evaluación':'evaluaciones'}${t.u?' · en '+nomUni(t.u):''}${t.tipo==='logro'?' · logrado / no logrado':''}</div></div>
    </div>`;

  // metricas del consolidado
  let sum=0,n=0,mejoraron=0,comparables=0;
  c.alumnos.forEach(a=>{
    const vals=fs.map(f=>{const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);return e?e.val:''});
    const nums=vals.map(v=>valNum(t,v)).filter(v=>v!==null);
    if(nums.length){sum+=nums[nums.length-1];n++}
    if(nums.length>1){comparables++;
      const d=nums[nums.length-1]-nums[0];
      if(t.mejor==='menor'?d<0:d>0)mejoraron++}
  });
  const prom = n? (t.tipo==='logro' ? Math.round(sum/n*100)+'%' : (sum/n).toFixed(1).replace('.',',')) : '—';
  h+=`<div class="mgrid" style="margin-top:14px">
    ${cuadro('m-az',t.tipo==='logro'?'logro':'prom',t.tipo==='logro'?'Logro del curso':'Promedio',prom)}
    ${cuadro('m-vd','ok','Mejoró',comparables?Math.round(mejoraron/comparables*100)+'%':'—')}
    ${cuadro('m-mo','fecha',fs.length===1?'Fecha':'Fechas',fs.length)}
    ${cuadro('m-na','est','Estudiantes',c.alumnos.length)}
  </div>`;
  h+=`<div class="hint">Cada columna es una fecha de aplicación. La flecha compara con la evaluación anterior del mismo estudiante.</div></div>`;

  h+=`<div class="card"><h2>Elegir test</h2><div class="testgrp">${DB.tests.map(x=>`<button type="button" class="tbtn ${x.id===TESTSEL?'sel':''}" data-t="${x.id}">${icoSVG(x.id,'tico ti')}<span>${nomTest(x)}</span></button>`).join('')}</div></div>`;

  if(!fs.length){
    h+=`<div class="card"><h2>Sin evaluaciones</h2><div class="hint">Todavía no hay registros de este test. Ve a Evaluar y anota los primeros resultados.</div></div>`;
    return h;
  }

  h+=`<div class="card"><h2>Comparativa del curso</h2><div class="tabc"><table><thead><tr><th class="est">Estudiante</th>`;
  fs.forEach((f,i)=>{h+=`<th><span class="dchip">${i+1}</span><br>${fcorta(f).slice(0,5)}</th>`});
  h+=`</tr></thead><tbody>`;
  c.alumnos.forEach((a,i)=>{
    h+=`<tr><td class="est"><span class="idx">${String(i+1).padStart(2,'0')}</span>${a.n}</td>`;
    let prev=null;
    fs.forEach(f=>{
      const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);
      const v=e&&e.val?e.val:'';
      const asi=e&&e.asist?e.asist:'';
      if(!v){h+=`<td>${asi==='A'||asi==='J'?asi:'—'}</td>`;return}
      const m=prev?mejora(t,prev,v):null;
      h+=`<td><b>${v}</b>${m?`<br><span class="trend ${m.c}">${m.t}</span>`:''}</td>`;
      prev=v;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>
   <div class="leyenda"><span><b class="trend up">verde</b> mejoró</span><span><b class="trend down">rojo</b> retrocedió</span><span><b>A</b> ausente</span><span><b>J</b> justificado</span></div>
  </div>`;

  h+=`<button type="button" class="cta" id="pdfCons"><span class="ico">📄</span>Consolidado en PDF<span class="arrow">›</span></button>`;
  h+=`<button type="button" class="fila" id="docCons"><span class="ico">📝</span>Consolidado en Word<span class="arrow">›</span></button>`;
  return h;
}

function escudoDoc(){
  const img=document.getElementById('logoImg');
  return `<img src="${img?img.src:''}" style="width:58px;height:auto">`;
}

function docHTML(cuerpo){
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><style>${ESTILO_DOC}</style></head>
<body>${cuerpo.replace('<div class="doc-esc"></div>','<div class="doc-esc">'+escudoDoc()+'</div>')}</body></html>`;
}

function bajarWord(nombre,cuerpo){
  const blob=new Blob(['\ufeff'+docHTML(cuerpo)],{type:'application/msword'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=nombre.replace(/[^\wáéíóúñÁÉÍÓÚÑ -]/g,'')+'.doc';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
  toast('Documento descargado');
}

function cuerpoConsolidado(){
  const c=curso(),t=testAct(),fs=fechasDe(t);
  let sum=0,n=0,mej=0,comp=0;
  c.alumnos.forEach(a=>{
    const nums=fs.map(f=>{const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);return valNum(t,e?e.val:'')}).filter(v=>v!==null);
    if(nums.length){sum+=nums[nums.length-1];n++}
    if(nums.length>1){comp++;const d=nums[nums.length-1]-nums[0];if(t.mejor==='menor'?d<0:d>0)mej++}
  });
  const prom=n?(t.tipo==='logro'?Math.round(sum/n*100)+'%':(sum/n).toFixed(1).replace('.',',')):'—';

  let h=membrete('Consolidado · '+nomTest(t),
    `${c.n} · ${fs.length} ${fs.length===1?'evaluación':'evaluaciones'}${t.u?' · resultado en '+nomUni(t.u):''}${t.tipo==='logro'&&t.seg?' · '+t.seg+' segundos':''}`);
  h+=tira([
    (t.tipo==='logro'?'Logro del curso: ':'Promedio del curso: ')+prom,
    'Mejoraron: '+(comp?mej+' de '+comp:'—'),
    'Estudiantes: '+c.alumnos.length
  ]);

  h+=seccion('Fechas de aplicación');
  h+=`<table class="d"><tbody><tr>${fs.map((f,i)=>`<td><b>${i+1}</b><br>${fcorta(f)}</td>`).join('')||'<td>Sin evaluaciones</td>'}</tr></tbody></table>`;

  h+=seccion('Comparativa por estudiante');
  h+=`<table class="d"><thead><tr><th style="width:7%">N°</th><th style="text-align:left">Estudiante</th>`;
  fs.forEach((f,i)=>h+=`<th>${i+1}</th>`);
  h+=`<th>Avance</th></tr></thead><tbody>`;
  c.alumnos.forEach((a,i)=>{
    h+=`<tr><td>${String(i+1).padStart(2,'0')}</td><td class="nm">${a.n}</td>`;
    const vals=[];
    fs.forEach(f=>{
      const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);
      const v=e&&e.val?e.val:''; vals.push(v);
      h+=`<td>${v||(e&&e.asist==='A'?'A':(e&&e.asist==='J'?'J':'—'))}</td>`;
    });
    const con=vals.filter(v=>v);
    const m=con.length>1?mejora(t,con[0],con[con.length-1]):null;
    h+=`<td class="${m?m.c:'eq'}">${m?m.t:'—'}</td></tr>`;
  });
  h+=`<tr class="tot"><td colspan="${2+fs.length}">${t.tipo==='logro'?'LOGRO DEL CURSO':'PROMEDIO DEL CURSO'}</td><td>${prom}</td></tr>`;
  h+=`</tbody></table>`;
  h+=seccion('Cómo leer esta tabla');
  h+=`<table class="d"><tbody><tr>
    <td><b class="up">verde</b><br>mejoró</td><td><b class="down">rojo</b><br>retrocedió</td>
    <td><b>=</b><br>sin cambio</td><td><b>A / J</b><br>ausente o justificado</td></tr></tbody></table>`;
  return h+piePagina();
}

function cuerpoEstudiante(){
  const c=curso(),a=c.alumnos.find(x=>x.id===DB.alumno);
  const resumen=DB.tests.map(t=>{
    const ev=(t.evals||[]).filter(e=>e.aid===a.id).sort((x,y)=>new Date(x.fecha)-new Date(y.fecha));
    const con=ev.filter(e=>e.val);
    return {t,ev,con,m:con.length>1?mejora(t,con[0].val,con[con.length-1].val):null};
  });
  const conReg=resumen.filter(r=>r.con.length).length;
  const compar=resumen.filter(r=>r.m);
  const subieron=compar.filter(r=>r.m.c==='up').length;
  const jornadas=(()=>{const f={};DB.tests.forEach(t=>(t.evals||[]).forEach(e=>{if(e.aid===a.id)f[e.fecha]=1}));return Object.keys(f).length})();

  let h=membrete(a.n, `Informe individual de condición física · ${c.n} · 2026`);
  h+=tira([
    'Tests con registro: '+conReg+' de '+DB.tests.length,
    'Mejoró en: '+(compar.length?subieron+' de '+compar.length:'—'),
    'Jornadas: '+jornadas
  ]);

  h+=seccion('Resumen general');
  h+=`<table class="d"><thead><tr><th style="text-align:left">Test</th><th>Primera</th><th>Última</th><th>Avance</th><th>Registros</th></tr></thead><tbody>`;
  resumen.forEach(r=>{
    if(!r.con.length){h+=`<tr><td class="nm">${nomTest(r.t)}</td><td colspan="4" style="color:#93a1ae">Sin registro</td></tr>`;return}
    h+=`<tr><td class="nm">${nomTest(r.t)}${r.t.u?' ('+nomUni(r.t.u)+')':''}</td>
      <td>${r.con[0].val}</td><td><b>${r.con[r.con.length-1].val}</b></td>
      <td class="${r.m?r.m.c:'eq'}">${r.m?r.m.t:'—'}</td><td>${r.con.length}</td></tr>`;
  });
  h+=`</tbody></table>`;

  resumen.filter(r=>r.ev.length).forEach(r=>{
    h+=seccion(nomTest(r.t)+(r.t.u?' · '+nomUni(r.t.u):'')+(r.t.tipo==='logro'&&r.t.seg?' · '+r.t.seg+' segundos':''));
    h+=`<table class="d"><thead><tr><th>Fecha</th><th>Asistencia</th><th>Resultado</th><th>Avance</th></tr></thead><tbody>`;
    r.ev.forEach((e,i)=>{
      const m=i>0?mejora(r.t,r.ev[i-1].val,e.val):null;
      h+=`<tr><td>${fcorta(e.fecha)}</td><td>${e.asist||'—'}</td><td><b>${e.val||'—'}</b></td>
          <td class="${m?m.c:'eq'}">${m?m.t:'—'}</td></tr>`;
    });
    h+=`</tbody></table>`;
  });

  const ad=DB.adaptaciones[a.id];
  if(ad&&Object.keys(ad).length){
    h+=seccion('Adaptaciones');
    h+=`<table class="d"><tbody>`;
    Object.entries(ad).forEach(([tid,d])=>{const t=DB.tests.find(x=>x.id===tid);
      h+=`<tr><td class="nm" style="width:32%"><b>${t?nomTest(t):tid}</b></td><td class="nm">${d}</td></tr>`});
    h+=`</tbody></table>`;
  }
  return h+piePagina();
}

function tablaCurso(t,f,c){
  const m=metricas();
  let h=seccion('Registro del curso · '+fcorta(f));
  h+=`<table class="d"><thead><tr><th style="width:9%">N°</th><th style="text-align:left">Estudiante</th>
      <th style="width:16%">Asistencia</th><th style="width:18%">Resultado</th></tr></thead><tbody>`;
  c.alumnos.forEach((a,i)=>{
    const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);
    h+=`<tr><td>${String(i+1).padStart(2,'0')}</td><td class="nm">${a.n}</td>
        <td>${e&&e.asist?e.asist:'—'}</td><td>${e&&e.val?e.val:'—'}</td></tr>`;
  });
  const res = t.tipo==='logro'
    ? (m.logro===null?'—':m.logro+'% de logro')
    : (m.prom===null?'—':fmt(m.prom,1).replace('.',',')+' '+nomUni(t.u));
  h+=`<tr class="tot"><td colspan="3">PROMEDIO DEL CURSO</td><td>${res}</td></tr>`;
  h+=`</tbody></table>`;
  return h;
}

function cuerpoCurso(){
  const t=testAct(),f=fechaAct(),c=curso(),m=metricas();
  let h=membrete(nomTest(t), `${c.n} · Aplicado el ${fcorta(f)}${t.tipo==='logro'&&t.seg?' · '+t.seg+' segundos':''}`);
  h+=tira([
    (t.tipo==='logro'?'Logro del curso: ':'Promedio del curso: ')+(t.tipo==='logro'?(m.logro===null?'—':m.logro+'%'):(m.prom===null?'—':fmt(m.prom,1).replace('.',','))),
    'Registrados: '+m.con+' de '+m.total,
    'Ausencias: '+m.aus+' sin justificar · '+m.just+' justificadas'
  ]);
  h+=seccion('Marcas de la planilla');
  h+=`<table class="d"><tbody><tr>
    <td><b>P</b><br>presente</td><td><b>A</b><br>ausente</td><td><b>J</b><br>justificado</td>
    <td><b>—</b><br>sin evaluar</td>${t.tipo==='logro'?'<td><b>L / NL</b><br>logrado o no</td>':''}</tr></tbody></table>`;
  h+=tablaCurso(t,f,c);
  return h+piePagina();
}

function informeCurso(){imprimir(cuerpoCurso())}

function cuerpoCurso(){
  const t=testAct(),f=fechaAct(),c=curso(),m=metricas();
  let h=membrete(nomTest(t), `Registro de aplicación · ${c.n} · ${fcorta(f)}`);
  const prom = t.tipo==='logro'
    ? (m.logro===null?'—':m.logro+'% de logro')
    : (m.prom===null?'—':fmt(m.prom,1).replace('.',',')+' '+nomUni(t.u));
  h+=panel([
    (t.tipo==='logro'?'Logro del curso: ':'Promedio del curso: ')+prom,
    `Registrados: ${m.con} de ${m.total}`,
    `Ausencias: ${m.aus} sin justificar · ${m.just} justificadas`
  ]);
  h+=seccion('Condiciones de aplicación',
    `<table class="d"><tbody>
      <tr><td class="nm" style="width:30%"><b>Test</b></td><td class="nm">${nomTest(t)}</td></tr>
      <tr><td class="nm"><b>Unidad de medida</b></td><td class="nm">${nomUni(t.u)||'—'}${t.tipo==='logro'?' (logrado / no logrado)':''}</td></tr>
      ${t.tipo==='logro'&&t.seg?`<tr><td class="nm"><b>Tiempo exigido</b></td><td class="nm">${t.seg} segundos</td></tr>`:''}
      ${t.id==='vel'&&t.mts?`<tr><td class="nm"><b>Distancia</b></td><td class="nm">${t.mts} metros</td></tr>`:''}
      <tr><td class="nm"><b>Fecha de aplicación</b></td><td class="nm">${fcorta(f)}</td></tr>
    </tbody></table>`);
  h+=seccion('Marcas de la planilla',
    `<table class="d"><thead><tr><th>P</th><th>A</th><th>J</th><th>—</th></tr></thead>
     <tbody><tr><td>presente</td><td>ausente</td><td>justificado</td><td>sin evaluar</td></tr></tbody></table>`);
  h+=seccion(`${c.n} · ${fcorta(f)}`,
    `<table class="d"><thead><tr><th style="width:8%">N°</th><th style="text-align:left">Estudiante</th>
      <th style="width:15%">Asistencia</th><th style="width:18%">Resultado</th></tr></thead><tbody>`+
    c.alumnos.map((a,i)=>{
      const e=(t.evals||[]).find(x=>x.aid===a.id&&x.fecha===f);
      return `<tr><td>${String(i+1).padStart(2,'0')}</td><td class="nm">${a.n}</td>
        <td>${e&&e.asist?e.asist:'—'}</td><td><b>${e&&e.val?e.val:'—'}</b></td></tr>`;
    }).join('')+
    `<tr class="total"><td></td><td class="nm">${t.tipo==='logro'?'LOGRO DEL CURSO':'PROMEDIO DEL CURSO'}</td>
      <td>${m.pres} presentes</td><td>${prom}</td></tr></tbody></table>`);
  return h+piePagina();
}

function bindFilas(){
  const CICLO=['','P','A','J'];
  document.querySelectorAll('.asi1').forEach(b=>b.addEventListener('click',ev=>{
    ev.preventDefault();
    const i=CICLO.indexOf(b.dataset.sel||''),v=CICLO[(i+1)%4];
    b.dataset.sel=v;b.textContent=v||'—';
    b.classList.remove('p','a','j');if(v)b.classList.add(v.toLowerCase());
    upsert(b.dataset.a,'asist',v);
  }));
  const LOGRO=['','L','NL'];
  document.querySelectorAll('.lg1').forEach(b=>b.addEventListener('click',ev=>{
    ev.preventDefault();
    const i=LOGRO.indexOf(b.dataset.sel||''),v=LOGRO[(i+1)%3];
    b.dataset.sel=v;b.textContent=v||'—';
    b.classList.remove('l','nl');if(v)b.classList.add(v.toLowerCase());
    upsert(b.dataset.a,'val',v);
  }));
  document.querySelectorAll('.evbot input').forEach(inp=>{
    const g=()=>upsert(inp.id.slice(3),'val',inp.value.trim());
    inp.addEventListener('input',g);inp.addEventListener('blur',g);
  });
  const sg=document.getElementById('segObj');
  if(sg)sg.addEventListener('input',()=>{const n=parseInt(sg.value,10);testAct().seg=isNaN(n)?0:n;save()});
  const mt=document.getElementById('mtsObj');
  if(mt)mt.addEventListener('input',()=>{const n=parseInt(mt.value,10);testAct().mts=isNaN(n)?0:n;save();
    const ti=document.querySelector('.thero .titulo');if(ti)ti.textContent=nomTest(testAct());
    const bt=document.querySelector('.tbtn[data-t="'+testAct().id+'"] span');if(bt)bt.textContent=nomTest(testAct());});
}

function pintarCabecera(){
  const p=document.getElementById('pillTxt');if(p)p.textContent=curso().n;
  const sel=document.getElementById('pillSel');
  if(sel)sel.innerHTML=DB.cursos.map(c=>`<option value="${c.id}" ${c.id===DB.activo?'selected':''}>${c.n}</option>`).join('');
}

function bindPicker(){
  document.querySelectorAll('.pkrow').forEach(b=>b.addEventListener('click',()=>{
    DB.alumno=b.dataset.e;save();render();
  }));
}

function bind(){
  const $=id=>document.getElementById(id);
  pintarCabecera();
  if($('pillCurso'))$('pillCurso').addEventListener('click',()=>{const s=$('pillSel');if(s){s.style.pointerEvents='auto';s.focus();s.click();if(s.showPicker)try{s.showPicker()}catch(e){}}});
  if($('pillSel'))$('pillSel').addEventListener('change',e=>{DB.activo=e.target.value;save();render()});
  if($('irAlumno'))$('irAlumno').addEventListener('click',()=>{VIEW='alumno';render()});
  const ir={goEval:'evaluaciones',goCon:'consolidado',goAlu:'alumno',goCur:'cursos',goAda:'adaptaciones',goDat:'datos'};
  Object.keys(ir).forEach(k=>{if($(k))$(k).addEventListener('click',()=>{VIEW=ir[k];render()})});
  if($('goIni'))$('goIni').addEventListener('click',()=>{VIEW='inicio';render()});
  if($('selCurso'))$('selCurso').addEventListener('change',e=>{DB.activo=e.target.value;save();render()});
  if($('addAlu')){$('addAlu').addEventListener('click',()=>{const n=$('nuevoAlu').value.trim();if(!n)return;curso().alumnos.push({id:uid(),n:n.toUpperCase()});save();render();toast('Estudiante agregado')})}
  document.querySelectorAll('[id^="verA"]').forEach(b=>b.addEventListener('click',()=>{DB.alumno=b.id.slice(4);save();VIEW='alumno';render()}));
  document.querySelectorAll('[id^="delA"]').forEach(b=>b.addEventListener('click',()=>{const aid=b.id.slice(4);const a=curso().alumnos.find(x=>x.id===aid);if(!a||!confirm('¿Eliminar a '+a.n+'?'))return;curso().alumnos=curso().alumnos.filter(x=>x.id!==aid);DB.tests.forEach(t=>{t.evals=t.evals.filter(e=>e.aid!==aid)});delete DB.adaptaciones[aid];save();render()}));
  document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',ev=>{ev.preventDefault();TESTSEL=b.dataset.t;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');DB.testsel=TESTSEL;save();if(VIEW==='consolidado'){render()}else{refrescar()}}));
  bindFilas();
  if($('evalFecha'))$('evalFecha').addEventListener('change',refrescar);
  if($('pdfCurso'))$('pdfCurso').addEventListener('click',informeCurso);
  if($('pdfAlumno'))$('pdfAlumno').addEventListener('click',informeAlumno);
  if($('docAlumno'))$('docAlumno').addEventListener('click',()=>{const a=curso().alumnos.find(x=>x.id===DB.alumno);bajarWord('Informe '+a.n,cuerpoEstudiante())});
  if($('pdfCons'))$('pdfCons').addEventListener('click',()=>imprimir(cuerpoConsolidado()));
  if($('docCons'))$('docCons').addEventListener('click',()=>bajarWord('Consolidado '+nomTest(testAct())+' '+curso().n,cuerpoConsolidado()));
  if($('docCurso'))$('docCurso').addEventListener('click',()=>bajarWord(nomTest(testAct())+' '+curso().n,cuerpoCurso()));

  
  if($('abrirSel'))$('abrirSel').addEventListener('click',()=>{
    const p=$('picker');const ab=p.style.display==='none';
    p.style.display=ab?'block':'none';
    if(ab){const b=$('buscaEst');b.value='';$('pklist').innerHTML=filasPicker('');bindPicker();setTimeout(()=>b.focus(),50)}
  });
  if($('buscaEst'))$('buscaEst').addEventListener('input',e=>{$('pklist').innerHTML=filasPicker(e.target.value);bindPicker()});
  bindPicker();
  const c0=curso(),p0=c0.alumnos.findIndex(x=>x.id===DB.alumno);
  if($('estPrev'))$('estPrev').addEventListener('click',()=>{if(p0>0){DB.alumno=c0.alumnos[p0-1].id;save();render()}});
  if($('estNext'))$('estNext').addEventListener('click',()=>{if(p0<c0.alumnos.length-1){DB.alumno=c0.alumnos[p0+1].id;save();render()}});
  if($('addAdapt')){$('addAdapt').addEventListener('click',()=>{const aid=$('selAluAd').value;const tid=$('selTestAd').value;const desc=$('descAdapt').value.trim();if(!desc)return;if(!DB.adaptaciones[aid])DB.adaptaciones[aid]={};DB.adaptaciones[aid][tid]=desc;save();render();toast('Adaptación guardada')})}
  document.querySelectorAll('[id^="delAd"]').forEach(b=>b.addEventListener('click',()=>{const [aid,tid]=b.id.slice(5).split('-');if(DB.adaptaciones[aid])delete DB.adaptaciones[aid][tid];save();render()}));
  if($('sySave')){$('sySave').addEventListener('click',()=>{
    const u=$('syUrl').value.trim().replace(/\/+$/,''), k=$('syKey').value.trim();
    if(!u||!k){toast('Faltan la URL o la clave');return}
    SY={url:u,key:k};
    try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}
    estado('Probando conexión...');
    bajar(true).then(()=>subir()).then(ok=>{toast(ok?'Sincronización activa':'Revisa la URL y la clave')});
  })}
  if($('syUp'))$('syUp').addEventListener('click',()=>subir().then(ok=>toast(ok?'Datos subidos':'No se pudo subir')));
  if($('syDown'))$('syDown').addEventListener('click',()=>bajar().then(ok=>toast(ok?'Datos actualizados':'Sin cambios nuevos')));
}

render();
try{if(syncListo()&&typeof fetch==='function')bajar(false)}catch(e){}
</script>
</body>
</html>
